# fantasm project configuration. See docs/configuration.md for the schema.

[project]
name = "acorn-6502-tube-client"

[rom]
# CMOS 65C02 in the external 6502 second processor. The ROM is a 4 kB
# image of which only the upper 2 kB is mapped at &F800-&FFFF; the
# driver script slices the upper half before feeding py8dis.
cpu = "65c02"
base_address = 0xF800

[versions]
prefixes = ["tube-6502-client"]
# Project-specific driver-filename template: the prefix has hyphens
# but the driver-script identifier replaces them with underscores.
driver_filename = "disasm_tube_6502_client_{version_id_no_dots}.py"

[[versions.entry]]
id = "1.10"
