name: Verify disassembly

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check README.md is up to date
        run: uv run generate_readme.py --check

  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Build beebasm
        uses: actions/cache@v4
        id: beebasm-cache
        with:
          path: /usr/local/bin/beebasm
          key: beebasm-v1.11-rebuild

      - name: Build beebasm from source
        if: steps.beebasm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11 https://github.com/stardot/beebasm.git /tmp/beebasm
          cmake -S /tmp/beebasm -B /tmp/beebasm/build
          make -C /tmp/beebasm/build -j$(nproc)
          sudo cp /tmp/beebasm/build/beebasm /usr/local/bin/

      # Render the version_id with dots removed, since the driver
      # script's filename uses the no-dots form (1.10 -> 110).
      - name: Compute driver path
        id: driver
        run: |
          ver="${{ matrix.version }}"
          ver_no_dots="${ver//./}"
          echo "path=versions/tube-6502-client-${ver}/disassemble/disasm_tube_6502_client_${ver_no_dots}.py" >> "$GITHUB_OUTPUT"

      # py8dis is invoked directly via the per-version driver script.
      # fantasm operates on the .json/.asm artefacts py8dis emits.
      # `fantasm disassemble VID` is filed as fantasm#2 — once it
      # lands the driver-script invocation collapses to a fantasm call.
      - name: Disassemble Acorn 6502 Tube Client ${{ matrix.version }}
        run: uv run python ${{ steps.driver.outputs.path }}

      - name: Lint Acorn 6502 Tube Client ${{ matrix.version }}
        run: uv run fantasm lint ${{ matrix.version }} ${{ steps.driver.outputs.path }}

      # Tube Client ROM is 4 kB but only the upper 2 kB is mapped, so
      # `fantasm verify` (strict size match) doesn't apply directly.
      # tools/verify_with_banking.py wraps fantasm.api.verify with the
      # slice. Drop once fantasm#1 lands.
      - name: Verify Acorn 6502 Tube Client ${{ matrix.version }}
        run: uv run tools/verify_with_banking.py ${{ matrix.version }}
